server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: gamedb
    password: gamedb

  jpa:
    # The SQL scripts own the schema - Hibernate must never touch it.
    hibernate:
      ddl-auto: none
      naming:
        # Take @Column names literally, so the quoted `DATETIME` survives.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp