server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamedb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: gamedb
    password: gamedb

  jpa:
    # The SQL scripts own the schema - Hibernate must never touch it.
    hibernate:
      ddl-auto: none
      naming:
        # Take @Column names literally, so the quoted `DATETIME` survives.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

report:
  table: account_tran
  amount-columns: []
  balance-columns: []
  amount-column-prefix: AMOUNT_
  balance-column-prefix: BALANCE_
  exclude-columns: []
  bet-tran-types: [GAME_BET]
  win-tran-types: [GAME_WIN]
  page-sizes: [25, 50, 100]
  default-range-days: 7
  csv-max-rows: 200000
  csv-chunk-size: 5000