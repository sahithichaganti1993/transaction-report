# Overrides for Spring's raw binding failures. Without these, typing a letter
# into Account ID surfaces the internal
# "Failed to convert property value of type java.lang.String..." text.
typeMismatch.criteria.accountId=Account ID must be a whole number
typeMismatch.criteria.startDateTime=Start date/time is not a valid date and time
typeMismatch.criteria.endDateTime=End date/time is not a valid date and time
typeMismatch.criteria.page=Page must be a whole number
typeMismatch.criteria.size=Page size must be a whole number
typeMismatch=Invalid value
